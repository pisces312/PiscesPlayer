# Daemon JVM criteria for this build (hand-maintained; see AGENTS.md "开发环境与路径引用").
# toolchainVersion pins the JVM used by the Gradle daemon and takes precedence over JAVA_HOME,
# so it must match the locally installed JDK on both machines (PC: D:\dev\jdk-25,
# phone: apt openjdk-25). jvmTarget stays 21.
# The toolchainUrl.* entries generated by `gradlew updateDaemonJvm` are deliberately omitted:
# they are foojay download links tied to a specific vendor build. Without them Gradle
# requires a local JDK 25 (JAVA_HOME counts) and never downloads one.
toolchainVersion=25
